databaseChangeLog:
  - changeSet:
      id: 002-create-articles
      author: roman

      changes:
        - createTable:
            tableName: articles

            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(255)

              - column:
                  name: text
                  type: VARCHAR(255)

              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: category_id
                  type: BIGINT