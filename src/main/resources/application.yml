spring:
  application:
    name: news-aggregator

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true


logging:
  level:
    root: INFO
    com.roman.gudkov: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE